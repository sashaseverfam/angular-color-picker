<div class="colorbox">
  <div class="colorbox__spectrum">
    <button
      id="spectrum-cursor"
      class="colorbox__spectrum-cursor"
      #spectrumCursor
    ></button>
    <canvas id="spectrum-canvas" #spectrumCanvas></canvas>
  </div>
  <div class="colorbox__hue-wrapper">
    <div class="colorbox__hue">
      <button id="hue-cursor" class="colorbox__hue-cursor" #hueCursor></button>
      <canvas id="hue-canvas" #hueCanvas></canvas>
    </div>
    <div class="colorbox__content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
